<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: transparent;
            color: #37352f;
        }

        .font-serif-journal {
            font-family: 'Newsreader', serif;
        }
    </style>
</head>
<body class="p-6 flex items-center justify-start min-h-screen">

    <div class="w-full max-w-lg space-y-4">
        <!-- Top Header -->
        <div class="flex justify-between items-center border-b border-stone-200/60 pb-2">
            <span id="currentDate" class="text-xs font-semibold uppercase tracking-widest text-stone-400"></span>
        </div>

        <!-- Content Area (English -> Italian -> German) -->
        <div class="space-y-3 py-1">
            <div id="loadingText" class="text-base font-serif-journal italic text-stone-400">Lade Zitat...</div>
            <p id="quoteEn" class="text-lg font-serif-journal font-normal leading-relaxed text-stone-900" style="display: none;"></p>
            <p id="quoteIt" class="text-base font-serif-journal italic leading-relaxed text-stone-700" style="display: none;"></p>
            <p id="quoteDe" class="text-base font-serif-journal text-stone-400 leading-relaxed" style="display: none;"></p>
            <p id="quoteAuthor" class="text-sm font-sans tracking-wide text-stone-400 pt-1 text-right" style="display: none;"></p>
        </div>

        <!-- Action Button -->
        <div>
            <button onclick="fetchDatabaseQuote()" class="text-xs uppercase tracking-widest text-stone-400 hover:text-stone-700 transition-colors">
                + Nuova citazione
            </button>
        </div>
    </div>

    <script>
        // Set today's full date in header
        function setTodayDate() {
            const today = new Date();
            const dateStr = today.toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
            document.getElementById('currentDate').innerText = dateStr;
        }

        // Free public translation helper
        async function translateText(text, targetLang) {
            try {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|${targetLang}`);
                const data = await res.json();
                if (data && data.responseData && data.responseData.translatedText) {
                    return data.responseData.translatedText;
                }
            } catch (e) {}
            return text;
        }

        async function fetchDatabaseQuote() {
            const loadingEl = document.getElementById("loadingText");
            const enEl = document.getElementById("quoteEn");
            const itEl = document.getElementById("quoteIt");
            const deEl = document.getElementById("quoteDe");
            const authorEl = document.getElementById("quoteAuthor");

            loadingEl.style.display = "block";
            enEl.style.display = "none";
            itEl.style.display = "none";
            deEl.style.display = "none";
            authorEl.style.display = "none";
            loadingEl.innerText = "Lade Zitat...";

            try {
                const response = await fetch("https://dummyjson.com/quotes/random");
                const data = await response.json();

                if (data && data.quote) {
                    const quoteText = data.quote;
                    const authorName = data.author;

                    // Fetch Italian and German translations concurrently
                    const [itTrans, deTrans] = await Promise.all([
                        translateText(quoteText, "it"),
                        translateText(quoteText, "de")
                    ]);

                    loadingEl.style.display = "none";
                    enEl.innerText = `"${quoteText}"`;
                    itEl.innerText = `"${itTrans}"`;
                    deEl.innerText = `"${deTrans}"`;
                    authorEl.innerText = `— ${authorName}`;

                    enEl.style.display = "block";
                    itEl.style.display = "block";
                    deEl.style.display = "block";
                    authorEl.style.display = "block";
                } else {
                    throw new Error("Fehler beim Laden");
                }
            } catch (error) {
                loadingEl.innerText = "Fehler beim Abrufen des Zitats.";
                console.error(error);
            }
        }

        window.onload = () => {
            setTodayDate();
            fetchDatabaseQuote();
        };
    </script>
</body>
</html>
