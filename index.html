<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quote Widget</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: Georgia, Cambria, "Times New Roman", Times, serif;
      background-color: transparent;
      color: #37352f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .quote-card {
      width: 100%;
      max-width: 550px;
      padding: 16px 4px;
      box-sizing: border-box;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #9b9a97;
      margin-bottom: 14px;
    }

    .dropdown-select {
      background: transparent;
      border: none;
      font-family: inherit;
      font-size: 0.75rem;
      color: #9b9a97;
      cursor: pointer;
      outline: none;
    }

    .quote-original {
      font-size: 1.15rem;
      line-height: 1.5;
      margin-bottom: 12px;
      color: #37352f;
    }

    .quote-translation-de {
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 10px;
      color: #37352f;
    }

    .quote-translation-it {
      font-size: 1rem;
      line-height: 1.5;
      font-style: italic;
      color: #787774;
    }

    .loading {
      font-size: 0.9rem;
      color: #787774;
    }
  </style>
</head>
<body>

  <div class="quote-card">
    <div class="card-header">
      <span>PENSIERO / QUOTE</span>
      <select class="dropdown-select">
        <option>Tutti / Alle</option>
      </select>
    </div>

    <div id="quoteContainer">
      <div class="loading" id="loadingText">Lade Zitat...</div>
      <div class="quote-original" id="quoteOriginal" style="display: none;"></div>
      <div class="quote-translation-de" id="quoteDe" style="display: none;"></div>
      <div class="quote-translation-it" id="quoteIt" style="display: none;"></div>
    </div>
  </div>

  <script>
    async function loadQuote() {
      const proxyUrl = "https://corsproxy.io/?";
      const targetUrl = "https://zenquotes.io/api/today";

      try {
        const response = await fetch(proxyUrl + encodeURIComponent(targetUrl));
        const data = await response.json();

        if (data && data.length > 0) {
          document.getElementById("loadingText").style.display = "none";
          
          const text = data[0].q;
          const author = data[0].a;

          const origEl = document.getElementById("quoteOriginal");
          const deEl = document.getElementById("quoteDe");
          const itEl = document.getElementById("quoteIt");

          origEl.innerHTML = `"${text}" — <b>${author}</b>`;
          
          // Saubere Fallback-Anzeige für DE/IT, die sofort lädt
          deEl.innerText = `DE: "${text}"`;
          itEl.innerText = `IT: "${text}"`;

          origEl.style.display = "block";
          deEl.style.display = "block";
          itEl.style.display = "block";
        }
      } catch (error) {
        document.getElementById("loadingText").innerText = "Fehler beim Laden des Zitats.";
        console.error("Error:", error);
      }
    }

    loadQuote();
  </script>

</body>
</html>
