<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zitate-Datenbank mit eigenem Styling</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: transparent; color: #37352f; }
        .font-serif-journal { font-family: 'Newsreader', serif; }
    </style>
</head>
<body class="p-6 flex items-center justify-start min-h-screen">

    <div class="w-full max-w-lg space-y-3">
        <!-- Top Header -->
        <div class="flex justify-between items-center">
            <span class="text-xs font-semibold uppercase tracking-widest text-stone-400">PENSIERO / QUOTE</span>
            <select class="text-xs bg-transparent text-stone-500 focus:outline-none cursor-pointer text-right border-none">
                <option>Tutti / Alle</option>
            </select>
        </div>

        <!-- Content Area (Hier greift DEIN individuelles Styling) -->
        <div class="space-y-2 py-1">
            <div id="loadingText" class="text-sm font-serif-journal italic text-stone-400">Lade Zitat aus Datenbank...</div>
            <p id="quoteEn" class="text-base font-serif-journal font-normal leading-relaxed text-stone-900" style="display: none;"></p>
            <p id="quoteDe" class="text-sm font-serif-journal text-stone-600 leading-relaxed" style="display: none;"></p>
            <p id="quoteIt" class="text-sm font-serif-journal italic leading-relaxed text-stone-400" style="display: none;"></p>
            <p id="quoteAuthor" class="text-xs font-sans tracking-wide text-stone-400 pt-1 text-right" style="display: none;"></p>
        </div>

        <!-- Action Button -->
        <div>
            <button onclick="fetchDatabaseQuote()" class="text-xs uppercase tracking-widest text-stone-400 hover:text-stone-700 transition-colors">
                + Nuova citazione
            </button>
        </div>
    </div>

    <script>
        // Freie Übersetzungs-API für DE & IT
        async function translateText(text, targetLang) {
            try {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|${targetLang}`);
                const data = await res.json();
                if (data && data.responseData && data.responseData.translatedText) {
                    return data.responseData.translatedText;
                }
            } catch (e) {}
            return text;
        }

        async function fetchDatabaseQuote() {
            const loadingEl = document.getElementById("loadingText");
            const enEl = document.getElementById("quoteEn");
            const deEl = document.getElementById("quoteDe");
            const itEl = document.getElementById("quoteIt");
            const authorEl = document.getElementById("quoteAuthor");

            loadingEl.style.display = "block";
            enEl.style.display = "none";
            deEl.style.display = "none";
            itEl.style.display = "none";
            authorEl.style.display = "none";
            loadingEl.innerText = "Lade Zitat aus Datenbank...";

            try {
                // Holt jedes Mal ein zufälliges Zitat aus einer riesigen JSON-Datenbank
                const response = await fetch("https://dummyjson.com/quotes/random");
                const data = await response.json();

                if (data && data.quote) {
                    const quoteText = data.quote;
                    const authorName = data.author;

                    // Übersetzt den Rohtext in Echtzeit ins Deutsche und Italienische
                    const [deTrans, itTrans] = await Promise.all([
                        translateText(quoteText, "de"),
                        translateText(quoteText, "it")
                    ]);

                    loadingEl.style.display = "none";
                    enEl.innerText = `"${quoteText}"`;
                    deEl.innerText = `DE: "${deTrans}"`;
                    itEl.innerText = `IT: "${itTrans}"`;
                    authorEl.innerText = `— ${authorName}`;

                    enEl.style.display = "block";
                    deEl.style.display = "block";
                    itEl.style.display = "block";
                    authorEl.style.display = "block";
                } else {
                    throw new Error("Fehler beim Laden");
                }
            } catch (error) {
                loadingEl.innerText = "Fehler beim Abrufen der Zitate.";
                console.error(error);
            }
        }

        // Beim Laden der Seite ausführen
        window.onload = fetchDatabaseQuote;
    </script>
</body>
</html>
